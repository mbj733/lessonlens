name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest -q

      # Recomputes every metric from the committed artifacts and rewrites eval/report.md.
      - name: eval (cache-only)
        run: python -m lessonlens eval --cache-only

      # The report must be reproducible: a stale committed report fails the build.
      - name: report is reproducible
        run: |
          git diff --stat
          git diff --exit-code -- eval/report.md eval/metrics.json

      - name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            eval/report.md
            eval/metrics.json
