name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest -q

      # Enabled automatically once B2/B4 land the eval module.
      - name: eval (cache-only)
        if: ${{ hashFiles('src/lessonlens/eval.py') != '' }}
        run: python -m lessonlens eval --cache-only

      - name: upload report
        if: ${{ hashFiles('eval/report.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: eval/report.md
